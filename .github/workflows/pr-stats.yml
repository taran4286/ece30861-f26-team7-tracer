name: PR stats

# pull_request_target runs the workflow and script from main with a token that
# can write issues, even for PRs from forks. The script only reads pull
# requests through the API; never check out or run a PR's code here.
on:
  pull_request_target:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# One run at a time; each run rebuilds the table from scratch, so a run that
# gets skipped while another waits loses nothing.
concurrency:
  group: pr-stats
  cancel-in-progress: false

jobs:
  update:
    name: Update PR stats issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/pr-stats.js');
            await run({ github, context, core });
