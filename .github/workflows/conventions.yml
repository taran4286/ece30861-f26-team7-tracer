name: Conventions

# Checks the PR's branch name, title and commit messages. Re-runs when the title
# is edited. Runs the PR's own code with a read-only token, so pull_request.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Branch, title and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the PR's commits and the base branch
          persist-credentials: false
      - name: Check naming conventions
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/check_conventions.py \
            --branch "$BRANCH" --title "$TITLE" --commits "origin/$BASE_REF..$HEAD_SHA"
