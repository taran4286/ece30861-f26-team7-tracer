[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tracer"
version = "0.1.0"
description = "Team 7 Tracer service"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.80,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fastapi>=0.140",
    # The tester's HTTP client; it also backs FastAPI's TestClient.
    "httpx2>=2.13",
    # The tester checks target responses against system-openapi.yaml.
    "jsonschema>=4.18",
    "pyyaml>=6.0",
    # Checks llm_base_url against RFC 3986, as format: uri asks.
    "rfc3986-validator>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "tester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import server.py and tests.helpers from the repo root.
pythonpath = ["."]

# Vercel loads the ASGI app from here instead of auto-detecting an entrypoint.
[tool.vercel]
entrypoint = "server:app"
