      tags:
      - Audit
      operationId: editAuditNotAllowed
      summary: Not allowed (REQ-22)
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirement-ids:
      - REQ-22
      description: |-
        Purpose: Not allowed (REQ-22)
        Requirements: REQ-22
        Not allowed (REQ-22)
        Request body: none. Use the declared path/query parameters and headers.
        Rejected requests leave stored project data unchanged.
    delete:
      tags:
      - Audit
      operationId: deleteAuditNotAllowed
      summary: Not allowed (REQ-22)
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirement-ids:
      - REQ-22
      description: |-
        Purpose: Not allowed (REQ-22)
        Requirements: REQ-22
        Not allowed (REQ-22)
        Request body: none. Use the declared path/query parameters and headers.
        Rejected requests leave stored project data unchanged.
  /groups:
    post:
      tags:
      - Groups
      operationId: createGroup
      summary: Link related incidents into a group (nice to have)
      description: |-
        Purpose: Link related incidents into a group (nice to have)
        Requirements: REQ-04. Roles: Responder, DisclosureApprover.
        All members must be UnderAssessment and not already grouped. Each member's group_id is set
        and its version increments.

        Rejected requests leave stored project data unchanged.
      parameters:
      - $ref: '#/components/parameters/XUserId'
      - $ref: '#/components/parameters/XUserRole'
      - $ref: '#/components/parameters/XTestRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirement-ids:
      - REQ-04
  /test/report:
    get:
      tags:
      - Test control
      operationId: getSystemCoverage
      summary: Read code coverage for a prepared session
      description: |-
        Purpose: Read code coverage for a prepared session
        Requirements: TEST-02

        No body or identity headers. Return source-line/branch coverage from project calls in this session since setup. Return 409 while preparation is incomplete; 404 for unknown session. Reading the report does not execute project operations or modify measurements; later project calls may update measurements.
        Request body: none. Use the declared path/query parameters and headers.
        State change: none.
        Rejected requests leave stored project data unchanged.
        No tests or project actions run during report lookup.
      parameters:
      - name: session_id
        in: query
        required: true
        schema: &id001
          type: string
          minLength: 1
          pattern: \S
      responses:
        '200':
          description: Session code coverage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCoverageReport'
              example:
                session_id: run-123
                coverage:
                  code:
                    covered: null
                    total: null
                    basis: Source lines; target instrumentation unavailable
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '404':
          description: Unknown session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '409':
          description: Session conflict or report not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '500':
          description: Operation failed or tester aborted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
      x-requirement-ids:
      - TEST-02
  /test/sessions/{session_id}/settings:
    patch:
      tags:
      - Test control
      operationId: updateSessionSettings
      summary: 'Pod extension: change a session clock or mutable settings'
      description: |-
        Purpose: Pod extension: change a session clock or mutable settings
        Requirements: TEST-07; supports REQ-09, REQ-10, REQ-11, REQ-20

        No identity headers. Update only test_now, at_risk_threshold_days, or llm_base_url. Reject registrant_type and leave all settings unchanged on error. Return run metadata. No project records or audit entries are created by this control operation.
        Rejected requests leave stored project data unchanged.
      parameters:
      - name: session_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSettingsUpdate'
            example:
              test_now: '2026-10-08T15:00:00Z'
      responses:
        '200':
          description: Updated run metadata; run_id equals session_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '404':
          description: Unknown session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '409':
          description: Session conflict or report not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
        '500':
          description: Operation failed or tester aborted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestControlError'
      x-requirement-ids:
      - TEST-07
      x-related-project-requirement-ids:
      - REQ-09
      - REQ-10
      - REQ-11
      - REQ-20
components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Role'
    XTestRun:
      name: X-Test-Run
      in: header
      required: true
      description: Session ID supplied to system POST /test/setup. X-Test-Run equals session_id; every
        project lookup is scoped to that session.
      schema:
        type: string
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: 'VALIDATION_ERROR: missing or invalid field; `field` names it (e.g. items[3].detected_at).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'FORBIDDEN_ROLE: role not allowed for this operation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'NOT_FOUND: unknown incident, evidence, draft, group, or run.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 'METHOD_NOT_ALLOWED: edits and deletes are rejected (REQ-22).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        One of: INVALID_TRANSITION (not allowed from current state); STALE_VERSION (sent version is
        older than stored; message says to reload, REQ-21); CONFLICT (group rule violated or draft
        already accepted); NOT_MATERIAL (draft requested for an incident that is not material).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: 'NOT_IMPLEMENTED: nice-to-have not built by this team.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum:
      - Responder
      - DisclosureApprover
      - Board
    State:
      type: string
      enum:
      - UnderAssessment
      - DeterminedMaterial
      - DeterminedNotMaterial
      - DisclosureDelayed
      - DisclosureRecorded
      - AmendmentPending
      - Closed
    FormType:
      type: string
      enum:
      - 8-K Item 1.05
      - 8-K Item 8.01
      - 6-K
      - 8-K/A
    FilingFormType:
      type: string
      enum:
      - 8-K Item 1.05
      - 6-K
      - 8-K/A
    DraftElementName:
      type: string
      enum:
      - nature
      - scope
      - timing
      - impact
    ImpactCategory:
      type: string
      enum:
      - operational
      - financial
      - legal_regulatory
      - reputational
      - data_compromised
    Flag:
      type: string
      enum:
      - at_risk
      - warning
      - overdue
    Source:
      type: string
      enum:
      - ticketing
      - siem
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - VALIDATION_ERROR
          - FORBIDDEN_ROLE
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - INVALID_TRANSITION
          - STALE_VERSION
          - CONFLICT
          - NOT_MATERIAL
          - NOT_IMPLEMENTED
          - DRAFTING_UNAVAILABLE
        message:
          type: string
        field:
          type: string
    TestRun:
      type: object
      required:
      - run_id
      - test_now
      - registrant_type
      - at_risk_threshold_days
      - llm_base_url
      - implemented_optional
      properties:
        run_id:
          type: string
          description: Compatibility metadata name for session_id; exactly the same value.
        test_now:
          type: string
          format: date-time
        registrant_type:
          type: string
          enum:
          - Domestic
          - FPI
        at_risk_threshold_days:
          type: integer
          minimum: 1
        llm_base_url:
          type: string
          format: uri
          description: Configured LLM URI metadata. A working LLM is not required for the Phase 3 testing
            interface.
        implemented_optional:
          type: array
          description: Nice-to-have requirement IDs this deployment built.
          items:
            type: string
            enum:
            - REQ-04
            - REQ-05
            - REQ-09
            - REQ-17
            - REQ-18
            - REQ-20
            - REQ-21
    TestReport:
      type: object
      required:
      - run
      - incidents
      - groups
      - audit
      properties:
        run:
          $ref: '#/components/schemas/TestRun'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    CreateIncidentRequest:
      type: object
      required:
      - title
      - discovery_date
      properties:
        title:
          type: string
          minLength: 1
        discovery_date:
          type: string
          format: date
          description: Not after today.
    Incident:
      type: object
      required:
      - incident_id
      - title
      - discovery_date
      - state
      - flags
      - filings
      - evidence
      - version
      properties:
        incident_id:
          type: string
        title:
          type: string
        discovery_date:
          type: string
          format: date
        state:
          $ref: '#/components/schemas/State'
        determination:
          oneOf:
          - $ref: '#/components/schemas/Determination'
          - type: 'null'
        required_form:
          oneOf:
          - $ref: '#/components/schemas/FormType'
          - type: 'null'
        due_date:
          type:
          - string
          - 'null'
          format: date
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        filings:
          type: array
          items:
            $ref: '#/components/schemas/Filing'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        group_id:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 1
    TicketingItem:
      type: object
      description: Raw simulated ticketing item.
      required:
      - ticket_id
      - summary
      - created_at
      properties:
        ticket_id:
          type: string
        summary:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    SiemItem:
      type: object
      description: Raw simulated SIEM alert.
      required:
      - alert_id
      - rule_name
      - severity
      - detected_at
      properties:
        alert_id:
          type: string
        rule_name:
          type: string
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        description:
          type: string
        detected_at:
          type: string
          format: date-time
    ImportRequest:
      type: object
      required:
      - source
      - items
      properties:
        source:
          $ref: '#/components/schemas/Source'
        items:
          type: array
          minItems: 1
          description: TicketingItem when source is ticketing; SiemItem when source is siem.
          items:
            oneOf:
            - $ref: '#/components/schemas/TicketingItem'
            - $ref: '#/components/schemas/SiemItem'
    EvidenceItem:
      type: object
      required:
      - evidence_id
      - incident_id
      - source
      - source_ref
      - summary
      - observed_at
      - imported_by
      - imported_at
      - impact_categories
      properties:
        evidence_id:
          type: string
        incident_id:
          type: string
        source:
          $ref: '#/components/schemas/Source'
        source_ref:
          type: string
          description: ticket_id or alert_id from the raw item.
        summary:
          type: string
        observed_at:
          type: string
          format: date-time
          description: created_at or detected_at from the raw item.
        imported_by:
          type: string
        imported_at:
          type: string
          format: date-time
          description: Real server time (AC-02).
        impact_categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ImpactCategory'
    TagRequest:
      type: object
      required:
      - impact_categories
      properties:
        impact_categories:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ImpactCategory'
    DeterminationRequest:
      type: object
      required:
      - decision
      - determination_date
      - rationale
      - evidence_refs
      - version
      properties:
        decision:
          type: string
          enum:
          - Material
          - NotMaterial
        determination_date:
          type: string
          format: date
          description: On or after discovery_date and not after today.
        rationale:
          type: string
          minLength: 1
        evidence_refs:
          type: array
          minItems: 1
          uniqueItems: true
          description: Evidence IDs belonging to this incident.
          items:
            type: string
        voluntary_disclosure:
          type: boolean
          description: Valid only with NotMaterial (REQ-18).
        version:
          type: integer
          minimum: 1
    Determination:
      type: object
      required:
      - decision
      - determination_date
      - rationale
      - evidence_refs
      - recorded_by
      - recorded_at
      properties:
        decision:
          type: string
          enum:
          - Material
          - NotMaterial
        determination_date:
          type: string
          format: date
        rationale:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        voluntary_disclosure:
          type: boolean
        recorded_by:
          type: string
        recorded_at:
          type: string
          format: date-time
    TransitionRequest:
      type: object
      required:
      - to
      - version
      properties:
        to:
          $ref: '#/components/schemas/State'
        version:
          type: integer
          minimum: 1
        info_available_date:
          type: string
          format: date
          description: Required when to is AmendmentPending; not after today.
        elements:
          type: array
          minItems: 1
          uniqueItems: true
          description: Required when to is AmendmentPending; subset of the latest filing's unavailable_elements.
          items:
            $ref: '#/components/schemas/DraftElementName'
    FilingRequest:
      type: object
      required:
      - form_type
      - filing_date
      - accession_number
      - version
      properties:
        form_type:
          $ref: '#/components/schemas/FilingFormType'
        filing_date:
          type: string
          format: date
          description: On or after determination_date; not after today.
        accession_number:
          type: string
          pattern: ^[0-9]{10}-[0-9]{2}-[0-9]{6}$
        unavailable_elements:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DraftElementName'
        home_disclosure_date:
          type: string
          format: date
          description: Required when form_type is 6-K (REQ-12).
        version:
          type: integer
          minimum: 1
    Filing:
      type: object
      required:
      - form_type
      - filing_date
      - accession_number
      - unavailable_elements
      - recorded_by
      - recorded_at
      properties:
        form_type:
          $ref: '#/components/schemas/FilingFormType'
        filing_date:
          type: string
          format: date
        accession_number:
          type: string
        unavailable_elements:
          type: array
          items:
            $ref: '#/components/schemas/DraftElementName'
        home_disclosure_date:
          type:
          - string
          - 'null'
          format: date
        recorded_by:
          type: string
        recorded_at:
          type: string
          format: date-time
    SensitiveFlag:
      type: object
      required:
      - excerpt
      - reason
      properties:
        excerpt:
          type: string
        reason:
          type: string
          description: e.g. hostname, IP address, CVE, unpatched system, firewall rule.
    DraftElement:
      type: object
      required:
      - text
      - citations
      - sensitive_flags
      properties:
        text:
          type: string
          description: Exactly "Not yet determined" when no evidence supports the element.
        citations:
          type: array
          items:
            type: string
        sensitive_flags:
          type: array
          items:
            $ref: '#/components/schemas/SensitiveFlag'
    Draft:
      type: object
      required:
      - draft_id
      - incident_id
      - form_type
      - elements
      - advisory
      - status
      properties:
        draft_id:
          type: string
        incident_id:
          type: string
        form_type:
          $ref: '#/components/schemas/FormType'
        elements:
          type: object
          required:
          - nature
          - scope
          - timing
          - impact
          properties:
            nature:
              $ref: '#/components/schemas/DraftElement'
            scope:
              $ref: '#/components/schemas/DraftElement'
            timing:
              $ref: '#/components/schemas/DraftElement'
            impact:
              $ref: '#/components/schemas/DraftElement'
        advisory:
          type: boolean
          const: true
        status:
          type: string
          enum:
          - Proposed
          - Accepted
        accepted_by:
          type:
          - string
          - 'null'
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
    AuditEntry:
      type: object
      required:
      - entry_id
      - user_id
      - timestamp
      - action
      - target_id
      - before
      - after
      properties:
        entry_id:
          type: string
        user_id:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Real server time.
        action:
          type: string
          enum:
          - create_incident
          - import_evidence
          - tag_evidence
          - record_determination
          - transition
          - record_filing
          - accept_draft
          - create_group
        target_id:
          type: string
        before:
          type:
          - object
          - 'null'
          description: Changed fields before the action; null on create.
        after:
          type: object
          description: Changed fields after the action.
    GroupRequest:
      type: object
      required:
      - incident_ids
      properties:
        incident_ids:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
    Group:
      type: object
      required:
      - group_id
      - incident_ids
      properties:
        group_id:
          type: string
        incident_ids:
          type: array
          items:
            type: string
    SessionId:
      type: object
      required:
      - session_id
      properties:
        session_id: &id002
          type: string
          minLength: 1
          pattern: \S
    TestControlError:
      type: object
      required:
      - message
      - source
      properties:
        message: *id002
        source: &id003
          type: string
          enum:
          - tester
          - system
          - communication
          - unknown
    CoverageMeasure:
      oneOf:
      - type: object
        required:
        - covered
        - total
        - basis
        properties:
          covered:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
          basis: *id002
      - type: object
        required:
        - covered
        - total
        - basis
        properties:
          covered:
            type: 'null'
          total:
            type: 'null'
          basis: *id002
      description: Source lines, branches, components, or acceptance criteria, as identified in basis.
        covered must not exceed total. If unavailable use null for both counts and explain why. Coverage
        measures exercised behavior, not passing results.
    SystemCoverageReport:
      type: object
      required:
      - session_id
      - coverage
      properties:
        session_id: *id002
        coverage:
          type: object
          required:
          - code
          properties:
            code:
              $ref: '#/components/schemas/CoverageMeasure'
    TestResult:
      type: object
      required:
      - test_id
      - outcome
      - message
      properties:
        test_id: *id002
        outcome:
          type: string
          enum:
          - pass
          - fail
          - error
          - skip
        message: *id002
        source: *id003
      allOf:
      - if:
          properties:
            outcome:
              const: error
          required:
          - outcome
        then:
          required:
          - source
    SuiteReport:
      type: object
      required:
      - session_id
      - target_url
      - results
      - coverage
      properties:
        session_id: *id002
        target_url:
          type: string
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/TestResult'
          description: Every planned test appears exactly once, with a unique nonempty test_id.
        coverage:
          type: object
          required:
          - code
          - component
          - system
          properties:
            code:
              $ref: '#/components/schemas/CoverageMeasure'
            component:
              $ref: '#/components/schemas/CoverageMeasure'
            system:
              $ref: '#/components/schemas/CoverageMeasure'
    SetupSettings:
      type: object
      properties:
        test_now:
          type: string
          format: date-time
          description: UTC clock for this session. Defaults to the fixed example clock when omitted.
          default: '2026-10-05T15:00:00Z'
        registrant_type:
          type: string
          enum:
          - Domestic
          - FPI
          description: Fixed for this session. Defaults to Domestic when omitted.
          default: Domestic
        at_risk_threshold_days:
          type: integer
          minimum: 1
          default: 7
        llm_base_url:
          type: string
          format: uri
          description: Optional LLM override for future drafting/failure tests; no LLM connection is required
            for setup.
      description: Pod starting settings. Empty setup is allowed and uses the documented fixed clock and
        Domestic defaults. No existing session can be updated through setup.
      additionalProperties: false
    SystemSetupRequest:
      type: object
      required:
      - session_id
      - setup
      properties:
        session_id: *id001
        setup:
          $ref: '#/components/schemas/SetupSettings'
    SessionSettingsUpdate:
      type: object
      required: []
      properties:
        test_now:
          type: string
